<title id="aera-layers-aera-dark-title">AERA conceptual component map</title>
<desc id="aera-layers-aera-dark-desc">A human connects through interaction surfaces to SDLC orchestration, which coordinates a delivery workflow and its autonomy, runs steps with defined artifacts, and uses context, specification, and task registries. A requirements workflow is shown as an example only.</desc>
